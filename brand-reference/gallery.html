<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zephyr Archive — supplied artwork</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #ede5d3; color: #273247; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 1500px; margin: auto; padding: 48px 30px; }
    h1 { margin: 0 0 8px; font: 44px/1.1 Georgia, serif; font-weight: normal; }
    p { max-width: 800px; }
    .swatches { display: flex; flex-wrap: wrap; gap: 20px; margin: 28px 0; }
    .swatches span { display: flex; align-items: center; gap: 8px; }
    .swatches i { display: inline-block; width: 26px; height: 26px; border: 1px solid #b9b7b1; }
    .gallery { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 18px; }
    figure { margin: 0; border: 1px solid #d9d6ce; background: white; }
    img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; }
    figcaption { padding: 12px 14px; border-top: 1px solid #e5e3df; }
    .sheet { grid-column: span 2; grid-row: span 2; }
    .sheet img { aspect-ratio: 4/3; }
    small { display: block; color: #61615e; }
    @media(max-width:800px) { .gallery { grid-template-columns: repeat(2,minmax(0,1fr)); } }
    @media(max-width:450px) { main { padding: 30px 16px; } h1 { font-size: 34px; } .gallery { grid-template-columns: 1fr; } .sheet { grid-column: auto; grid-row: auto; } }
  </style>
</head>
<body><main>
  <h1>Zephyr Archive</h1>
  <p>Supplied artwork reference. These are unchanged copies of the original PNGs, displayed on white so transparency renders correctly. This gallery is a review aid, not the proposed website.</p>
  <div class="swatches"><span><i style="background:#a24857"></i>Red · #A24857</span><span><i style="background:#3b4967"></i>Navy · #3B4967</span><span><i style="background:#ede5d3"></i>Cream · #EDE5D3</span></div>
  <div class="gallery">
    <figure class="sheet"><img src="png/ZEPHYR%20FINAL%20LOGO%20SET.png" alt="Overview of the supplied serif, sans-serif and script logos"><figcaption>Final logo set<small>Reference sheet · 4000 × 3000</small></figcaption></figure>
    <figure><img src="png/SERIF%202.png" alt="Horizontal serif Zephyr Archive wordmark"><figcaption>SERIF 2 — recommended main wordmark</figcaption></figure>
    <figure><img src="png/SERIF%201.png" alt="Stacked serif Zephyr Archive wordmark"><figcaption>SERIF 1 — stacked alternative</figcaption></figure>
    <figure><img src="png/SERIF%203.png" alt="Abbreviated serif Zephyr Arc. wordmark"><figcaption>SERIF 3 — abbreviated</figcaption></figure>
    <figure><img src="png/PASSPORTS%20GRAPHIC.png" alt="Collage of passport pages and visa stamps with Zephyr Archive lettering"><figcaption>Passport graphic — editorial accent</figcaption></figure>
    <figure><img src="png/SANS%201.png" alt="Abbreviated sans-serif Zephyr Arc. wordmark"><figcaption>SANS 1 — abbreviated</figcaption></figure>
    <figure><img src="png/SANS%202.png" alt="Horizontal sans-serif Zephyr Archive wordmark"><figcaption>SANS 2 — horizontal</figcaption></figure>
    <figure><img src="png/SANS%203.png" alt="Stacked sans-serif Zephyr Archive wordmark"><figcaption>SANS 3 — stacked</figcaption></figure>
    <figure><img src="png/SCRIPT%201.png" alt="Textured Zephyr script mark"><figcaption>SCRIPT 1 — textured script</figcaption></figure>
    <figure><img src="png/SCRIPT%202.png" alt="Smooth Zephyr script mark"><figcaption>SCRIPT 2 — smooth script</figcaption></figure>
    <figure><img src="png/SCRIPT%203.png" alt="Zephyr script mark with Arc. lettering"><figcaption>SCRIPT 3 — script with Arc.</figcaption></figure>
    <figure><img src="png/ZEPHYR%20STAMP%20GRAPHIC.png" alt="Zephyr script with entry stamp"><figcaption>Zephyr stamp graphic</figcaption></figure>
    <figure><img src="png/Z%20FOR%20ZEPHYR.png" alt="Z for Zephyr graphic"><figcaption>Z for Zephyr</figcaption></figure>
  </div>
</main></body></html>
